<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Match the embedded canvas before the application bundle paints.
      if (window.parent !== window) {
        var mode = 'dark';
        try { if (JSON.parse(localStorage.getItem('chief-appearance-embedded') || 'null')?.mode === 'light') mode = 'light'; } catch {}
        document.documentElement.style.backgroundColor = mode === 'light' ? '#ffffff' : '#18181b';
        document.documentElement.style.colorScheme = mode;
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <title>Chief Executive Suite</title>
    <meta name="description" content="Your personal team of AI agents." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
