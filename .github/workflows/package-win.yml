name: Package Chief Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - run: node scripts/verify-chief-package.mjs release/win-unpacked/resources
      - name: Check bundled browser in an isolated home
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release/win-unpacked/resources"
      - name: Check the packaged server outside the checkout
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release/win-unpacked/resources/browser-engine"
      - name: Check packaged app onboarding and restart
        run: node scripts/verify-chief-desktop.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-windows-candidate
          path: |
            release/Chief-*.exe
            release/Chief-*.zip
          if-no-files-found: error
          retention-days: 14
