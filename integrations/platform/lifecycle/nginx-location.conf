# Include inside the reviewed workspace server block; never log bearer/cookies.
# The service validates the original browser Host (including port) and Origin.
location ^~ /chief/v1/ {
    proxy_pass http://chief-lifecycle:8097;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
    proxy_buffering off;
    access_log off;
}
