# Derived from PlatformSelfhost .huly.nginx, commit 42fdd73311843cea76fb7f9dade9d7397b358368. EPL-2.0; see upstream/LICENSE.
# Chief isolated loopback deployment; upstream proxy routes retained.
server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Resolve service names through Docker's DNS on every request (cached 10s)
    # instead of once at startup: after `docker compose restart` containers can
    # get new IPs, and a startup-time lookup would keep sending requests to the
    # old ones (502). proxy_pass only re-resolves when its target is a variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

# Include inside the reviewed workspace server block; never log bearer/cookies.
# The service validates the original browser Host (including port) and Origin.
location ^~ /chief/v1/ {
    proxy_pass http://chief-lifecycle:8097;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
    proxy_buffering off;
    access_log off;
}

    location /crewframe-theme/ {
        alias /usr/share/nginx/crewframe-theme/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script src="/crewframe-theme/bootstrap.js?v=1"></script><link rel="stylesheet" href="/crewframe-theme/crewframe.css?v=1"><script defer src="/crewframe-theme/crewframe.js?v=1"></script></head>';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $upstream http://front:8080;
        proxy_pass $upstream;
    }

    # Account cookies need their own browser partition inside the cross-site
    # Chief iframe. Keep this adaptation on the cookie lifecycle endpoint only.
    # nginx 1.21 has no Partitioned flag; append it to the exact root cookie path.
    location = /_accounts/cookie {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags ~^account-metadata-Token(\.sig)?$ secure httponly samesite=none;
        proxy_cookie_path ~^/$ "/; Partitioned";

        # Expire legacy unpartitioned cookies too, so a direct-page logout
        # cannot silently restore the old account on the following reload.
        add_header Set-Cookie "account-metadata-Token=; Path=/; Domain=localhost; Max-Age=0; HttpOnly; SameSite=Lax";
        add_header Set-Cookie "account-metadata-Token.sig=; Path=/; Domain=localhost; Max-Age=0; HttpOnly; SameSite=Lax";
        set $upstream http://account:3000;
        rewrite ^ /cookie break;
        proxy_pass $upstream;
    }

    location /_accounts {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $upstream http://account:3000;
        rewrite ^/_accounts/?(.*)$ /$1 break;
        proxy_pass $upstream;
    }

